<div class="p-6 space-y-6">
    <app-breadcrumb [items]="[{ title: 'Master', icon: 'settings' }, { title: 'Department', icon: 'building' }]">
    </app-breadcrumb>
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">

        <div>
            <h1 class="text-3xl font-bold text-heading">
                Master Department
            </h1>

            <p class="mt-1 text-sm text-body-muted">
                Manage department
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative">
                <input type="text" placeholder="Search department..."
                    class="w-full sm:w-72 px-4 py-2 rounded-base border border-default bg-neutral-primary-soft focus:outline-none focus:ring-2 focus:ring-brand-soft">
            </div>
            <app-button title="Filter" [variant]="BUTTON_VARIANTS.OUTLINE">
            </app-button>
            <app-button title="Add Department" icon="plus" [variant]="BUTTON_VARIANTS.PRIMARY" (onClick)="openAddModal()">
            </app-button>
        </div>
    </div>

    <div class="bg-neutral-primary-soft border border-default rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-neutral-secondary-medium border-b border-default-medium">
                    <tr>
                        <th class="w-10 px-4 py-4">
                            <input type="checkbox">
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Department Code
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Department Name
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="isLoading">
                        <td colspan="3" class="py-16">
                            <div class="flex justify-center">
                                <app-circularProgress [isLoading]="true">
                                </app-circularProgress>
                            </div>
                        </td>
                    </tr>
                    <ng-container *ngIf="!isLoading && department.length > 0">
                        <tr *ngFor="let item of department"
                            class="border-b border-default hover:bg-neutral-secondary-medium transition">
                            <td class="px-4 py-4">
                                <input type="checkbox">
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.departmentCode }}
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.departmentName }}
                                </div>
                            </td>
                            <td class="px-6 py-4 justify-items-center">
                                <div class="flex items-center gap-4">
                                    <app-button (onClick)="openEditModal(item)" icon="square-pen"
                                        [size]="BUTTON_SIZES.SM" [radius]="BUTTON_RADIUS.FULL"
                                        [variant]="BUTTON_VARIANTS.OUTLINE"
                                        customClass="border-yellow-500 text-yellow-600 hover:bg-yellow-50">
                                    </app-button>

                                    <app-button (onClick)="deleteDepartment(item.departmentId)" icon="trash-2"
                                        [size]="BUTTON_SIZES.SM" [radius]="BUTTON_RADIUS.FULL"
                                        [variant]="BUTTON_VARIANTS.OUTLINE"
                                        customClass="border-red-500 text-red-600 hover:bg-red-50">
                                    </app-button>
                                </div>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="!isLoading && department.length === 0">
                        <td colspan="9">
                            <div class="py-16 text-center">
                                <div class="text-lg font-medium text-heading">
                                    No Department Found
                                </div>
                                <div class="mt-2 text-sm text-body-muted">
                                    There is no department data available.
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-4 border-t border-default">
            <span class="text-sm text-body-muted">
                Total Department: {{ department.length }}
            </span>
            <div class="flex gap-2">
                <app-button title="Previous" icon="chevron-left" [variant]="BUTTON_VARIANTS.OUTLINE">
                </app-button>

                <app-button title="Next" icon="chevron-right" [variant]="BUTTON_VARIANTS.OUTLINE">
                </app-button>
            </div>
        </div>
    </div>
</div>
<app-modal *ngIf="showModal" [title]="modalMode === 'add'
        ? 'Add Department'
        : 'Edit Department'" size="lg" (close)="closeModal()">
    <div modal-body>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <app-input label="Department Code" [ngModel]="selectedDepartment().departmentCode"
                    (ngModelChange)="updateField('departmentCode', $event)"
                    [error]="showErrors() ? validationErrors().departmentCode : ''">
                </app-input>
            </div>
            <div>
                <app-input label="Department Name" [ngModel]="selectedDepartment().departmentName"
                    (ngModelChange)="updateField('departmentName', $event)"
                    [error]="showErrors() ? validationErrors().departmentName : ''">
                </app-input>
            </div>
        </div>
    </div>
    <div modal-footer>
        <app-button title="Cancel" [variant]="BUTTON_VARIANTS.OUTLINE" (onClick)="closeModal()" customClass="mr-2">
        </app-button>
        <app-button [title]="modalMode === 'add'
                ? 'Create Department'
                : 'Update Department'" icon="save" [variant]="BUTTON_VARIANTS.PRIMARY" (onClick)="saveDepartment()"
            customClass="mt-2">
        </app-button>
    </div>
</app-modal>
