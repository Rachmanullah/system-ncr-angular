<div class="p-6 space-y-6">
    <app-breadcrumb [items]="[{ title: 'System', icon: 'app-window' }, { title: 'Menu', icon: 'menu' }]">
    </app-breadcrumb>
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold text-heading">
                Master Menu
            </h1>

            <p class="mt-1 text-sm text-body-muted">
                Manage application menu
            </p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3">
            <div>
                <app-search-input (search)="applyFilter($event)"></app-search-input>
            </div>
            <app-button *appHasPermission="'CREATE_MENU'" title="Add Menu" icon="plus" [variant]="BUTTON_VARIANTS.PRIMARY" (onClick)="openAddModal()">
            </app-button>
        </div>
    </div>
    <div class="bg-neutral-primary-soft border border-default rounded-lg shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-neutral-secondary-medium border-b border-default-medium">
                    <tr>
                        <th class="w-10 px-4 py-4">
                            <input type="checkbox">
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Menu Title
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Menu Icon
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Menu Route
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Menu Parent
                        </th>
                        <th class="px-6 py-4 font-semibold text-center">
                            Action
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngIf="isLoading">
                        <td colspan="6" class="py-16">
                            <div class="flex justify-center">
                                <app-circularProgress [isLoading]="true">
                                </app-circularProgress>
                            </div>
                        </td>
                    </tr>
                    <ng-container *ngIf="!isLoading && filteredData.length > 0">
                        <tr *ngFor="let item of paginatedData"
                            class="border-b border-default hover:bg-neutral-secondary-medium transition">
                            <td class="px-4 py-4">
                                <input type="checkbox">
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.menuTitle }}
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.menuIcon }}
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.menuRoute }}
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-heading text-center">
                                    {{ item.menuParentTitle }}
                                </div>
                            </td>
                            <td class="px-6 py-4 justify-items-center">
                                <div class="flex items-center gap-4">
                                    <app-button *appHasPermission="'UPDATE_MENU'" (onClick)="openEditModal(item)" icon="square-pen"
                                        [size]="BUTTON_SIZES.SM" [radius]="BUTTON_RADIUS.FULL"
                                        [variant]="BUTTON_VARIANTS.OUTLINE"
                                        customClass="border-yellow-500 text-yellow-600 hover:bg-yellow-50">
                                    </app-button>

                                    <app-button *appHasPermission="'DELETE_MENU'" (onClick)="deleteMenu(item.menuId)" icon="trash-2"
                                        [size]="BUTTON_SIZES.SM" [radius]="BUTTON_RADIUS.FULL"
                                        [variant]="BUTTON_VARIANTS.OUTLINE"
                                        customClass="border-red-500 text-red-600 hover:bg-red-50">
                                    </app-button>
                                </div>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="!isLoading && filteredData.length === 0">
                        <td colspan="9">
                            <div class="py-16 text-center">
                                <div class="text-lg font-medium text-heading">
                                    No Menu Found
                                </div>
                                <div class="mt-2 text-sm text-body-muted">
                                    There is no menu data available.
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 px-6 py-4 border-t border-default">
            <span class="text-sm text-body-muted">
                Total Menu: {{ menus.length }}
            </span>
            <div class="flex gap-2">
                <app-button (click)="changePage(currentPage - 1)" disable="currentPage===1"  title="Previous" icon="chevron-left" [variant]="BUTTON_VARIANTS.OUTLINE">
                </app-button>

                <app-button (click)="changePage(currentPage + 1)" disable="currentPage===totalPages" title="Next" icon="chevron-right" [variant]="BUTTON_VARIANTS.OUTLINE">
                </app-button>
            </div>
        </div>
    </div>
</div>
<app-modal *ngIf="showModal" [title]="modalMode === 'add'
        ? 'Add Menu'
        : 'Edit Menu'" size="lg" (close)="closeModal()">
    <div modal-body>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <app-input label="Menu Title" [ngModel]="selectedMenu().menuTitle"
                    (ngModelChange)="updateField('menuTitle', $event)"
                    [error]="showErrors() ? validationErrors().menuTitle : ''">
                </app-input>
            </div>
            <div>
                <app-input label="Menu Icon" [ngModel]="selectedMenu().menuIcon"
                    (ngModelChange)="updateField('menuIcon', $event)"
                    [error]="showErrors() ? validationErrors().menuIcon : ''">
                </app-input>
            </div>
            <div>
                <app-input label="Menu Route" [ngModel]="selectedMenu().menuRoute"
                    (ngModelChange)="updateField('menuRoute', $event)"
                    [error]="showErrors() ? validationErrors().menuRoute : ''">
                </app-input>
            </div>
            <div>
                <app-select-input label="Menu Parent" placeholder="Select Parent" [options]="menuOptions"
                    [ngModel]="selectedMenu().menuParentId" (ngModelChange)="updateField('menuParentId', +$event)"
                    [error]="showErrors() ? validationErrors().menuParentId : ''">
                </app-select-input>
            </div>
        </div>
    </div>
    <div modal-footer>
        <app-button title="Cancel" [variant]="BUTTON_VARIANTS.OUTLINE" (onClick)="closeModal()" customClass="mr-2">
        </app-button>
        <app-button [title]="modalMode === 'add'
                ? 'Create Menu'
                : 'Update Menu'" icon="save" [variant]="BUTTON_VARIANTS.PRIMARY" (onClick)="saveMenu()"
            customClass="mt-2">
        </app-button>
    </div>
</app-modal>
