<div class="w-full">
    <label *ngIf="label" class="block mb-2 text-sm font-medium text-heading">
        {{ label }}
        <span *ngIf="required" class="ml-0.5 text-red-500">
            *
        </span>
    </label>

    <textarea [rows]="rows" [value]="value" [readonly]="readonly" [disabled]="disabled" [placeholder]="placeholder"
        (input)="handleInput($event)" (blur)="onTouched()" [class.border-red-500]="error"
        [class.focus:border-red-500]="error" [class.focus:ring-red-500]="error"
        class="w-full px-4 py-2.5 text-sm text-heading bg-white border border-gray-300 rounded-lg shadow-sm transition-all duration-200 placeholder:text-gray-400 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-brand/20 focus:border-brand disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed readonly:bg-gray-50 resize-y">
    </textarea>

    <p *ngIf="error" class="mt-1.5 text-xs font-medium text-red-500">
        {{ error }}
    </p>
</div>
