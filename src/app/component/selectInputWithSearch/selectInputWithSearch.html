<div class="w-full">
    <label *ngIf="label" class="block mb-2 text-sm font-medium text-gray-700">
        {{ label }}
    </label>

    <div class="relative">
        <!-- Trigger -->

        <button type="button" [disabled]="disabled" (click)="toggle()"
            class="w-full flex items-center justify-between px-4 py-2.5 text-sm bg-white border border-gray-300 rounded-xl shadow-sm transition-all hover:border-gray-400 focus:outline-none focus:ring-4 focus:ring-blue-100 focus:border-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
            <span [class.text-gray-400]="!selectedLabel" class="truncate">
                {{ selectedLabel || placeholder }}
            </span>

            <lucide-icon [name]="open ? 'chevron-up' : 'chevron-down'" class="w-4 h-4 text-gray-400">
            </lucide-icon>
        </button>

        <!-- Dropdown -->

        <div *ngIf="open"
            class="absolute z-50 mt-2 w-full bg-white border border-gray-200 rounded-xl shadow-xl overflow-hidden">
            <!-- Search -->

            <div class="p-3 border-b">
                <div class="relative">
                    <lucide-icon name="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400">
                    </lucide-icon>

                    <input type="text" placeholder="Search..." [value]="searchText" (input)="onSearch($event)"
                        class="w-full pl-10 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500" />
                </div>
            </div>

            <!-- Options -->

            <div class="max-h-60 overflow-y-auto">
                <button type="button" *ngFor="let item of filteredOptions" (click)="selectOption(item)"
                    class="w-full flex items-center justify-between px-4 py-3 text-left text-sm hover:bg-blue-50 transition-colors">
                    <span>
                        {{ item.label }}
                    </span>

                    <lucide-icon *ngIf="value === item.value" name="check" class="w-4 h-4 text-blue-600">
                    </lucide-icon>
                </button>

                <div *ngIf="filteredOptions.length === 0" class="py-8 text-center text-sm text-gray-400">
                    No data found
                </div>
            </div>
        </div>
        <p *ngIf="error" class="mt-1 text-xs text-red-500">
            {{ error }}
        </p>
    </div>
</div>
