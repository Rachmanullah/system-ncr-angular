<button type="button" (click)="onClick.emit()" [disabled]="disabled" class="
    inline-flex items-center gap-1.5
    border border-blue-400
    text-sm font-medium
    rounded-base
    px-3 py-2
    leading-4
    text-blue-600
    hover:bg-blue-50 hover:text-blue-700
    focus:ring-2 focus:outline-none focus:ring-blue-200
    disabled:opacity-60 disabled:cursor-not-allowed
  ">
    <lucide-icon *ngIf="icon" [name]="icon" class="w-4 h-4"></lucide-icon>

    <span>{{ title }}</span>
</button>
