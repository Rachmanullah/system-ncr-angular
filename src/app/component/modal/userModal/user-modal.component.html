<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm"
>
  <div
    class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6
           animate-[fadeIn_0.2s_ease-out] scale-100"
  >
    <h3 class="text-lg font-semibold text-gray-800 mb-5">
      {{ mode === 'add' ? 'Add User' : 'Edit User' }}
    </h3>

    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-600">Name</label>
        <input
          type="text"
          [(ngModel)]="form.name"
          required
          [class.border-red-500]="!!errors['name']"
          class="w-full mt-1 rounded-lg border px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-brand/40
                 transition"
        />
        <p *ngIf="errors['name']" class="text-xs text-red-600 mt-1">
          {{ errors['name'] }}
        </p>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">Username</label>
        <input
          type="text"
          [(ngModel)]="form.username"
          required
          [class.border-red-500]="!!errors['username']"
          class="w-full mt-1 rounded-lg border px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-brand/40
                 transition"
        />
        <p *ngIf="errors['username']" class="text-xs text-red-600 mt-1">
          {{ errors['username'] }}
        </p>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">Password</label>
        <input
          type="password"
          [(ngModel)]="form.password"
          [class.border-red-500]="!!errors['password']"
          class="w-full mt-1 rounded-lg border px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-brand/40
                 transition"
        />
        <p *ngIf="errors['password']" class="text-xs text-red-600 mt-1">
          {{ errors['password'] }}
        </p>
      </div>

      <div>
        <label class="text-sm font-medium text-gray-600">Role</label>
        <select
          [(ngModel)]="form.roleId"
          required
          [class.border-red-500]="!!errors['roleId']"
          class="w-full mt-1 rounded-lg border px-3 py-2 text-sm bg-white
                 focus:outline-none focus:ring-2 focus:ring-brand/40
                 transition"
        >
          <option disabled value="">-- Select Role --</option>
          <option *ngFor="let role of roles" [value]="role.roleId">
            {{ role.roleName }}
          </option>
        </select>

        <p *ngIf="errors['roleId']" class="text-xs text-red-600 mt-1">
          {{ errors['roleId'] }}
        </p>
      </div>
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button
        type="button"
        (click)="close.emit()"
        class="px-4 py-2 text-sm rounded-lg border border-gray-300 text-gray-600
               hover:bg-gray-100 hover:text-gray-800
               active:scale-95 transition"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="submit()"
        [disabled]="submitting"
        class="px-5 py-2 text-sm rounded-lg font-medium
               bg-brand-soft text-fg-brand
               hover:bg-brand hover:text-white
               active:scale-95
               disabled:opacity-50 disabled:cursor-not-allowed
               transition"
      >
        {{ submitting ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>
