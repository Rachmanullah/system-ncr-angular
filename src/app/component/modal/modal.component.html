<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4"
    (click)="onBackdropClick()">
    <div class="bg-white shadow-2xl w-full flex flex-col max-h-[90vh]" [ngClass]="rounded" [style.max-width]="width"
        (click)="$event.stopPropagation()">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-400">
            <h2 class="text-lg font-semibold text-gray-800">
                {{ title }}
            </h2>
            <button *ngIf="showCloseButton" type="button" class="text-gray-500 hover:text-gray-700"
                (click)="close.emit()">
                ✕
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-6">
            <ng-content select="[modal-body]"></ng-content>
        </div>
        <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-400">
            <ng-content select="[modal-footer]"></ng-content>
        </div>
    </div>
</div>
